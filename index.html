<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Result — Coming Soon</title>
  <style>
    :root {
      --accent1: #6a11cb;
      --accent2: #2575fc;
      --text: #f6f9ff;
      --muted: rgba(246,249,255,0.75);
    }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: clamp(0.9rem, 4vw, 1rem);
    }
    .loader {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    button {
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
      margin: auto;
      display: block;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    footer {
      margin-top: 15px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Result will be coming soon</h1>
    <p>We are finalizing the results. Stay tuned!</p>
    
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <button id="goBtn" disabled>Go to Result</button>
    <footer id="dateNow"></footer>
  </div>

  <script>
    // Redirect URL (keep empty until ready)
    const redirectUrl = "";

    const goBtn = document.getElementById("goBtn");
    const dateNow = document.getElementById("dateNow");

    // Show today's date
    dateNow.textContent = new Date().toLocaleString();

    if (redirectUrl) {
      goBtn.disabled = false;
      goBtn.onclick = () => window.location.href = redirectUrl;
    }
  </script>
</body>
</html>
